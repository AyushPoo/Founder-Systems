  <text x="648" y="310" fill="#1B1C1A" font-family="Arial, sans-serif" font-size="36" font-weight="800">“Is this interesting?”</text>

  <rect x="610" y="390" width="514" height="196" rx="34" fill="#FF5A1F"/>
  <text x="648" y="450" fill="white" font-family="Arial, sans-serif" font-size="26" font-weight="800">ASK INSTEAD:</text>
  <text x="648" y="514" fill="white" font-family="Arial, sans-serif" font-size="34" font-weight="800">Which product, workflow,</text>
  <text x="648" y="558" fill="white" font-family="Arial, sans-serif" font-size="34" font-weight="800">or GTM assumption should</text>
  <text x="648" y="602" fill="white" font-family="Arial, sans-serif" font-size="34" font-weight="800">we re-test in 7 days?</text>

  <rect x="610" y="626" width="152" height="54" rx="22" fill="#101828" fill-opacity="0.1"/>
  <text x="648" y="660" fill="#1B1C1A" font-family="Arial, sans-serif" font-size="24" font-weight="700">Ignore</text>
  <rect x="778" y="626" width="146" height="54" rx="22" fill="#101828" fill-opacity="0.1"/>
  <text x="817" y="660" fill="#1B1C1A" font-family="Arial, sans-serif" font-size="24" font-weight="700">Watch</text>
