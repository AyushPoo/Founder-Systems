  <text x="1006" y="120" fill="white" font-family="Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="2">6 MIN READ</text>

  <rect x="84" y="184" width="470" height="532" rx="34" fill="#101828"/>
  <text x="124" y="274" fill="#FFB493" font-family="Arial, sans-serif" font-size="50" font-weight="900">REACT TO AI</text>
  <text x="124" y="334" fill="#FFB493" font-family="Arial, sans-serif" font-size="50" font-weight="900">NEWS WITHOUT</text>
  <text x="124" y="394" fill="#FFB493" font-family="Arial, sans-serif" font-size="50" font-weight="900">GETTING DISTRACTED</text>
  <rect x="124" y="476" width="344" height="120" rx="26" fill="#FFF7EF"/>
  <text x="156" y="536" fill="#1B1C1A" font-family="Arial, sans-serif" font-size="28" font-weight="800">Headline → assumption</text>
  <text x="156" y="574" fill="#1B1C1A" font-family="Arial, sans-serif" font-size="28" font-weight="800">→ test → decision</text>

  <rect x="610" y="184" width="514" height="172" rx="34" fill="#FFF7EF" stroke="#1B1C1A" stroke-width="4"/>
