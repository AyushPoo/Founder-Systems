  <text x="658" y="364" fill="#1B1C1A" font-family="Arial, sans-serif" font-size="34" font-weight="800">2. Who already feels the cost?</text>
  <text x="658" y="416" fill="#1B1C1A" font-family="Arial, sans-serif" font-size="34" font-weight="800">3. What proof earns a build?</text>

