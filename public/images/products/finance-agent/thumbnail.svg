<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
      .title-text { font-family: 'Outfit', sans-serif; font-weight: 900; fill: #1b1c1a; }
      .body-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; fill: #4b5563; }
      .badge-text { font-family: 'Outfit', sans-serif; font-weight: 800; fill: #ffffff; letter-spacing: 2px; }
      .mono-text { font-family: monospace; font-size: 11px; fill: #f59e0b; font-weight: bold; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13110d" />
      <stop offset="100%" stop-color="#1a1712" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="75%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#glowGrad)" />

  <!-- Outer Border (Amber Retro Tech) -->
  <rect x="20" y="20" width="760" height="560" rx="24" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="3" />
  <rect x="23" y="23" width="754" height="554" rx="21" fill="none" stroke="#1b1c1a" stroke-width="2" />

  <!-- Terminal Window Mockup -->
  <g filter="url(#shadow)" transform="translate(-175, 0)">
    <rect x="420" y="80" width="310" height="440" rx="16" fill="#0b0a09" stroke="#f59e0b" stroke-width="2.5" />
    
    <!-- Window Header -->
    <rect x="420" y="80" width="310" height="40" rx="16" fill="#141210" />
    <rect x="420" y="120" width="310" height="1.5" fill="#201c18" />
    <circle cx="445" cy="100" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="460" cy="100" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="475" cy="100" r="5" fill="#f59e0b" opacity="0.8" />
    <text x="575" y="105" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#f59e0b">runway_audit_v2.py</text>

    <!-- Shell Text -->
    <text x="440" y="155" class="mono-text" font-size="10" fill="#6b7280">sh finance-operator.sh</text>
    <text x="440" y="175" class="mono-text" font-size="10" fill="#f59e0b">Compiling Burn Rates &amp; Cash...</text>
    
    <!-- Active Automation Pipeline -->
    <rect x="440" y="200" width="270" height="100" rx="8" fill="#12100e" stroke="#201c18" stroke-width="1.5" />
    <text x="455" y="222" font-family="monospace" font-size="10" font-weight="bold" fill="#f59e0b">[RUNWAY MONITOR: ACTIVE]</text>
    <text x="455" y="247" font-family="monospace" font-size="9" fill="#9ca3af">> Cash Runway: 14.8 months</text>
    <text x="455" y="262" font-family="monospace" font-size="9" fill="#9ca3af">> Monthly Burn: $12,450</text>
    <text x="455" y="280" font-family="monospace" font-size="9" fill="#f59e0b">● budget_alert: 0 anomalies [SAFE]</text>

    <text x="440" y="325" class="mono-text" font-size="10" fill="#6b7280">&gt; calculating_growth_forecasts...</text>

    <!-- Visual Burn Charts -->
    <g transform="translate(440, 350)">
      <rect width="270" height="135" rx="8" fill="#12100e" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5" />
      
      <!-- Grid line and plot inside dashboard -->
      <path d="M 15,115 H 255" stroke="#201c18" stroke-width="1" />
      <path d="M 20,95 L 60,85 L 100,65 L 140,55 L 180,45 L 220,25" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" />
      
      <circle cx="220" cy="25" r="4" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
      <text x="225" y="20" font-family="monospace" font-size="8" fill="#ffffff">$80k MRR</text>

      <text x="15" y="20" font-family="monospace" font-size="9" fill="#9ca3af">ARR Projections</text>
    </g>

  </g>
</svg>