<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
      .title-text { font-family: 'Outfit', sans-serif; font-weight: 900; fill: #1b1c1a; }
      .body-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; fill: #4b5563; }
      .mono-text { font-family: monospace; font-size: 11px; fill: #ff5f15; font-weight: bold; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ef" />
      <stop offset="100%" stop-color="#f5e2d0" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a3d" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff7a3d" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#1b1c1a" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#glowGrad)" />

  <!-- Tech Grid Overlay -->
  <path d="M 0,100 H 800 M 0,200 H 800 M 0,300 H 800 M 0,400 H 800 M 0,500 H 800 M 100,0 V 600 M 200,0 V 600 M 300,0 V 600 M 400,0 V 600 M 500,0 V 600 M 600,0 V 600 M 700,0 V 600" stroke="#1b1c1a" stroke-opacity="0.04" stroke-width="1" />
  
  <!-- Outer Border -->
  <rect x="20" y="20" width="760" height="560" rx="24" fill="none" stroke="#1b1c1a" stroke-width="3" />

  <!-- Spec / Decision Tree Mockup (Centered) -->
  <g filter="url(#shadow)" transform="translate(-175, 0)">
    <rect x="420" y="80" width="310" height="440" rx="16" fill="#ffffff" stroke="#1b1c1a" stroke-width="3" />
    
    <!-- Window Header -->
    <rect x="420" y="80" width="310" height="40" rx="16" fill="#fcfbf7" />
    <rect x="420" y="120" width="310" height="2" fill="#1b1c1a" />
    <circle cx="445" cy="100" r="5" fill="#ff5f15" stroke="#1b1c1a" stroke-width="1.5" />
    <circle cx="460" cy="100" r="5" fill="#1b1c1a" />
    <circle cx="475" cy="100" r="5" fill="#1b1c1a" />
    <text x="575" y="105" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#1b1c1a">strategy_brief.md</text>

    <!-- Content: Decision Graph -->
    <path d="M 575,190 L 515,280 M 575,190 L 635,280 M 515,280 L 475,370 M 515,280 L 555,370 M 635,280 L 635,370" stroke="#1b1c1a" stroke-width="2.5" stroke-dasharray="4 4" />
    <path d="M 575,190 L 515,280" stroke="#ff5f15" stroke-width="3" />
    <path d="M 515,280 L 555,370" stroke="#ff5f15" stroke-width="3" />

    <!-- Graph Nodes -->
    <circle cx="575" cy="190" r="24" fill="#ffffff" stroke="#1b1c1a" stroke-width="3" />
    <text x="575" y="195" text-anchor="middle" class="title-text" font-size="14" fill="#1b1c1a">W1</text>

    <circle cx="515" cy="280" r="20" fill="#ffefea" stroke="#ff5f15" stroke-width="3" />
    <text x="515" y="285" text-anchor="middle" class="title-text" font-size="12" fill="#ff5f15">MVP</text>

    <circle cx="635" cy="280" r="20" fill="#ffffff" stroke="#1b1c1a" stroke-width="3" />
    <text x="635" y="285" text-anchor="middle" class="title-text" font-size="12">GTM</text>

    <circle cx="475" cy="370" r="16" fill="#ffffff" stroke="#1b1c1a" stroke-width="2.5" />
    <text x="475" y="374" text-anchor="middle" class="title-text" font-size="10">v1</text>

    <circle cx="555" cy="370" r="16" fill="#ff5f15" stroke="#1b1c1a" stroke-width="2.5" />
    <path d="M 551,370 L 554,373 L 560,367" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <circle cx="635" cy="370" r="16" fill="#ffffff" stroke="#1b1c1a" stroke-width="2.5" />
    <text x="635" y="374" text-anchor="middle" class="title-text" font-size="10">Ads</text>

    <!-- Code Block Mimic -->
    <rect x="440" y="420" width="270" height="70" rx="8" fill="#1b1c1a" />
    <text x="455" y="442" class="mono-text" fill="#ff7a3d">Assumptions: Validated</text>
    <text x="455" y="462" class="mono-text" fill="#22c55e">Confidence Score: 87%</text>
    <text x="455" y="482" class="mono-text" fill="#9ca3af">Exclusions: Out of Scope</text>
  </g>
</svg>