<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
      .title-text { font-family: 'Outfit', sans-serif; font-weight: 900; fill: #1b1c1a; }
      .body-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; fill: #4b5563; }
      .mono-text { font-family: monospace; font-size: 11px; fill: #6366f1; font-weight: bold; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#1b1c1a" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#glowGrad)" />

  <!-- Tech Grid Overlay -->
  <path d="M 0,100 H 800 M 0,200 H 800 M 0,300 H 800 M 0,400 H 800 M 0,500 H 800 M 100,0 V 600 M 200,0 V 600 M 300,0 V 600 M 400,0 V 600 M 500,0 V 600 M 600,0 V 600 M 700,0 V 600" stroke="#1b1c1a" stroke-opacity="0.04" stroke-width="1" />
  
  <!-- Outer Border -->
  <rect x="20" y="20" width="760" height="560" rx="24" fill="none" stroke="#1b1c1a" stroke-width="3" />

  <!-- Main Wrapper (Centered) -->
  <g filter="url(#shadow)" transform="translate(-175, 0)">
    <rect x="420" y="80" width="310" height="440" rx="16" fill="#ffffff" stroke="#1b1c1a" stroke-width="3" />
    
    <!-- Window Header -->
    <rect x="420" y="80" width="310" height="40" rx="16" fill="#fcfbf7" />
    <rect x="420" y="120" width="310" height="2" fill="#1b1c1a" />
    <circle cx="445" cy="100" r="5" fill="#6366f1" stroke="#1b1c1a" stroke-width="1.5" />
    <circle cx="460" cy="100" r="5" fill="#1b1c1a" />
    <circle cx="475" cy="100" r="5" fill="#1b1c1a" />
    <text x="575" y="105" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#1b1c1a">outbox_draft.json</text>

    <!-- Outbox Emails Stack Mockup -->
    <!-- Card 1 -->
    <rect x="440" y="140" width="270" height="100" rx="12" fill="#faf5ff" stroke="#1b1c1a" stroke-width="2" />
    <circle cx="470" cy="180" r="16" fill="#e0e7ff" stroke="#1b1c1a" stroke-width="2" />
    <text x="470" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1b1c1a">IN</text>
    <text x="500" y="175" class="title-text" font-size="14" fill="#1b1c1a">Cold Email Sequence</text>
    <text x="500" y="195" class="body-text" font-size="11" fill="#6b7280">Target: Tech Founders (India)</text>
    
    <rect x="635" y="170" width="60" height="20" rx="10" fill="#10b981" />
    <text x="665" y="183" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" font-weight="bold" fill="#ffffff">REPLY</text>

    <!-- Card 2 -->
    <rect x="440" y="260" width="270" height="100" rx="12" fill="#ffffff" stroke="#1b1c1a" stroke-width="2" />
    <circle cx="470" cy="300" r="16" fill="#fef3c7" stroke="#1b1c1a" stroke-width="2" />
    <text x="470" y="304" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1b1c1a">LI</text>
    <text x="500" y="295" class="title-text" font-size="14" fill="#1b1c1a">LinkedIn Connection</text>
    <text x="500" y="315" class="body-text" font-size="11" fill="#6b7280">Target: VCs &amp; Angels</text>

    <rect x="635" y="290" width="60" height="20" rx="10" fill="#6366f1" />
    <text x="665" y="303" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" font-weight="bold" fill="#ffffff">SENT</text>

    <!-- Card 3 -->
    <rect x="440" y="380" width="270" height="100" rx="12" fill="#ffffff" stroke="#1b1c1a" stroke-width="2" />
    <circle cx="470" cy="420" r="16" fill="#e0f2fe" stroke="#1b1c1a" stroke-width="2" />
    <text x="470" y="424" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1b1c1a">TW</text>
    <text x="500" y="415" class="title-text" font-size="14" fill="#1b1c1a">Outbound Offer DM</text>
    <text x="500" y="435" class="body-text" font-size="11" fill="#6b7280">Target: Indie Hackers</text>

    <rect x="635" y="410" width="60" height="20" rx="10" fill="#f59e0b" />
    <text x="665" y="423" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" font-weight="bold" fill="#ffffff">OPENED</text>
  </g>
</svg>