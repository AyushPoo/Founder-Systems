<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
      .title-text { font-family: 'Outfit', sans-serif; font-weight: 900; fill: #1b1c1a; }
      .body-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; fill: #4b5563; }
      .mono-text { font-family: monospace; font-size: 11px; fill: #2563eb; font-weight: bold; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#1b1c1a" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#glowGrad)" />

  <!-- Tech Grid Overlay -->
  <path d="M 0,100 H 800 M 0,200 H 800 M 0,300 H 800 M 0,400 H 800 M 0,500 H 800 M 100,0 V 600 M 200,0 V 600 M 300,0 V 600 M 400,0 V 600 M 500,0 V 600 M 600,0 V 600 M 700,0 V 600" stroke="#1b1c1a" stroke-opacity="0.04" stroke-width="1" />
  
  <!-- Outer Border -->
  <rect x="20" y="20" width="760" height="560" rx="24" fill="none" stroke="#1b1c1a" stroke-width="3" />

  <!-- Main Wrapper (Centered) -->
  <g filter="url(#shadow)" transform="translate(-175, 0)">
    <rect x="420" y="80" width="310" height="440" rx="16" fill="#ffffff" stroke="#1b1c1a" stroke-width="3" />
    
    <!-- Window Header -->
    <rect x="420" y="80" width="310" height="40" rx="16" fill="#fcfbf7" />
    <rect x="420" y="120" width="310" height="2" fill="#1b1c1a" />
    <circle cx="445" cy="100" r="5" fill="#2563eb" stroke="#1b1c1a" stroke-width="1.5" />
    <circle cx="460" cy="100" r="5" fill="#1b1c1a" />
    <circle cx="475" cy="100" r="5" fill="#1b1c1a" />
    <text x="575" y="105" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#1b1c1a">candidate_check.json</text>

    <!-- Candidate Profile visual Mockup -->
    <!-- Profile Info -->
    <circle cx="480" cy="180" r="32" fill="#dbeafe" stroke="#1b1c1a" stroke-width="2" />
    <path d="M 465,200 C 465,190 470,182 480,182 C 490,182 495,190 495,200 Z" fill="#2563eb" stroke="#1b1c1a" stroke-width="1.5" />
    <circle cx="480" cy="170" r="8" fill="#2563eb" />
    
    <text x="530" y="175" class="title-text" font-size="15" fill="#1b1c1a">Sarah Jenkins</text>
    <text x="530" y="195" class="body-text" font-size="11" fill="#4b5563">Senior React Engineer</text>
    <text x="530" y="210" font-family="sans-serif" font-size="9" fill="#9ca3af">Ex-Stripe • 6 Yrs Exp</text>

    <line x1="440" y1="235" x2="710" y2="235" stroke="#e5e7eb" stroke-width="2" />

    <!-- Role Match Check -->
    <!-- Criteria 1 -->
    <rect x="440" y="255" width="270" height="42" rx="8" fill="#ffffff" stroke="#1b1c1a" stroke-width="1.5" />
    <text x="455" y="280" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold" fill="#1b1c1a">System Architecture</text>
    <rect x="640" y="266" width="55" height="20" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1" />
    <text x="667" y="279" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" font-weight="bold" fill="#166534">STRONG</text>

    <!-- Criteria 2 -->
    <rect x="440" y="310" width="270" height="42" rx="8" fill="#ffffff" stroke="#1b1c1a" stroke-width="1.5" />
    <text x="455" y="335" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold" fill="#1b1c1a">NextJS / CSS Frameworks</text>
    <rect x="640" y="321" width="55" height="20" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1" />
    <text x="667" y="334" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" font-weight="bold" fill="#166534">STRONG</text>

    <!-- Criteria 3 -->
    <rect x="440" y="365" width="270" height="42" rx="8" fill="#ffffff" stroke="#1b1c1a" stroke-width="1.5" />
    <text x="455" y="390" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold" fill="#1b1c1a">Founder Alignment</text>
    <rect x="640" y="376" width="55" height="20" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1" />
    <text x="667" y="389" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" font-weight="bold" fill="#b45309">MID</text>

    <!-- Overall Match circular progress -->
    <rect x="440" y="420" width="270" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <circle cx="490" cy="460" r="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" />
    <path d="M 490,438 A 22,22 0 1,1 468,460" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />
    <text x="490" y="464" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" fill="#1b1c1a">88%</text>
    
    <text x="535" y="455" font-family="'Outfit', sans-serif" font-weight="800" font-size="13" fill="#1b1c1a">High-Confidence Fit</text>
    <text x="535" y="473" class="body-text" font-size="10" fill="#4b5563">Recommended for next tech interview</text>
  </g>
</svg>