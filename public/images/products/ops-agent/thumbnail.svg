<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
      .title-text { font-family: 'Outfit', sans-serif; font-weight: 900; fill: #1b1c1a; }
      .body-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; fill: #4b5563; }
      .badge-text { font-family: 'Outfit', sans-serif; font-weight: 800; fill: #ffffff; letter-spacing: 2px; }
      .mono-text { font-family: monospace; font-size: 11px; fill: #3b82f6; font-weight: bold; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1115" />
      <stop offset="100%" stop-color="#141820" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="75%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#glowGrad)" />

  <!-- Outer Border (Blue Retro Tech) -->
  <rect x="20" y="20" width="760" height="560" rx="24" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="3" />
  <rect x="23" y="23" width="754" height="554" rx="21" fill="none" stroke="#1b1c1a" stroke-width="2" />

  <!-- Terminal Window Mockup -->
  <g filter="url(#shadow)" transform="translate(-175, 0)">
    <rect x="420" y="80" width="310" height="440" rx="16" fill="#090a0f" stroke="#3b82f6" stroke-width="2.5" />
    
    <!-- Window Header -->
    <rect x="420" y="80" width="310" height="40" rx="16" fill="#10131a" />
    <rect x="420" y="120" width="310" height="1.5" fill="#1c212e" />
    <circle cx="445" cy="100" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="460" cy="100" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="475" cy="100" r="5" fill="#3b82f6" opacity="0.8" />
    <text x="575" y="105" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#3b82f6">sop_tracker_v3.py</text>

    <!-- Shell Text -->
    <text x="440" y="155" class="mono-text" font-size="10" fill="#6b7280">sh operations-operator.sh</text>
    <text x="440" y="175" class="mono-text" font-size="10" fill="#3b82f6">Auditing Workflow Cadences...</text>
    
    <!-- Active Automation Pipeline -->
    <rect x="440" y="200" width="270" height="100" rx="8" fill="#0d1117" stroke="#1c212e" stroke-width="1.5" />
    <text x="455" y="222" font-family="monospace" font-size="10" font-weight="bold" fill="#3b82f6">[SOP CADENCE: ENGAGED]</text>
    <text x="455" y="247" font-family="monospace" font-size="9" fill="#9ca3af">> Task Handoffs: 12 audited</text>
    <text x="455" y="262" font-family="monospace" font-size="9" fill="#9ca3af">> Pipeline Drift: 2% (negligible)</text>
    <text x="455" y="280" font-family="monospace" font-size="9" fill="#3b82f6">● flow_check: 8 lanes synced [OK]</text>

    <text x="440" y="325" class="mono-text" font-size="10" fill="#6b7280">&gt; verifying_internal_communication...</text>

    <!-- Process Checklist Mockup -->
    <g transform="translate(440, 350)">
      <rect width="270" height="135" rx="8" fill="#0d1117" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5" />
      
      <!-- Handoff checklist items in terminal -->
      <text x="15" y="25" font-family="monospace" font-size="9" fill="#9ca3af">OPERATIONAL TRACKS</text>
      <text x="15" y="50" font-family="monospace" font-size="10" fill="#ffffff">[x] Weekly standup cadence: OK</text>
      <text x="15" y="70" font-family="monospace" font-size="10" fill="#ffffff">[x] SOP: dev_to_qa_handoff: OK</text>
      <text x="15" y="90" font-family="monospace" font-size="10" fill="#ffffff">[x] SOP: marketing_retro_loop: OK</text>
      <text x="15" y="110" font-family="monospace" font-size="10" fill="#a8a29e">[ ] SOP: customer_feedback_log: (Pending)</text>
    </g>

  </g>
</svg>