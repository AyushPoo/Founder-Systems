<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
      .title-text { font-family: 'Outfit', sans-serif; font-weight: 900; fill: #1b1c1a; }
      .body-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; fill: #4b5563; }
      .mono-text { font-family: monospace; font-size: 11px; fill: #ea580c; font-weight: bold; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf5" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#1b1c1a" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#glowGrad)" />

  <!-- Tech Grid Overlay -->
  <path d="M 0,100 H 800 M 0,200 H 800 M 0,300 H 800 M 0,400 H 800 M 0,500 H 800 M 100,0 V 600 M 200,0 V 600 M 300,0 V 600 M 400,0 V 600 M 500,0 V 600 M 600,0 V 600 M 700,0 V 600" stroke="#1b1c1a" stroke-opacity="0.04" stroke-width="1" />
  
  <!-- Outer Border -->
  <rect x="20" y="20" width="760" height="560" rx="24" fill="none" stroke="#1b1c1a" stroke-width="3" />

  <!-- Main Wrapper (Centered) -->
  <g filter="url(#shadow)" transform="translate(-175, 0)">
    <rect x="420" y="80" width="310" height="440" rx="16" fill="#ffffff" stroke="#1b1c1a" stroke-width="3" />
    
    <!-- Window Header -->
    <rect x="420" y="80" width="310" height="40" rx="16" fill="#fcfbf7" />
    <rect x="420" y="120" width="310" height="2" fill="#1b1c1a" />
    <circle cx="445" cy="100" r="5" fill="#ea580c" stroke="#1b1c1a" stroke-width="1.5" />
    <circle cx="460" cy="100" r="5" fill="#1b1c1a" />
    <circle cx="475" cy="100" r="5" fill="#1b1c1a" />
    <text x="575" y="105" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#1b1c1a">investor_update_q2.md</text>

    <!-- Report Format visual Mockup -->
    <!-- Wins / Metrics section -->
    <rect x="440" y="140" width="270" height="80" rx="12" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5" />
    <text x="455" y="165" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" fill="#15803d">🏆 KEY WINS &amp; TRACTION</text>
    <text x="455" y="185" class="body-text" font-size="11" fill="#166534">• MRR grew 22% MoM ($45k active)</text>
    <text x="455" y="200" class="body-text" font-size="11" fill="#166534">• CAC payback reduced to 4 months</text>

    <!-- Chart Mockup -->
    <rect x="440" y="235" width="270" height="140" rx="12" fill="#ffffff" stroke="#1b1c1a" stroke-width="2" />
    <path d="M 460,340 H 690 M 460,250 V 340" stroke="#d1d5db" stroke-width="1" />
    
    <!-- Rising Bar Graph -->
    <rect x="480" y="310" width="24" height="30" rx="2" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" />
    <rect x="520" y="290" width="24" height="50" rx="2" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" />
    <rect x="560" y="270" width="24" height="70" rx="2" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" />
    <rect x="600" y="260" width="24" height="80" rx="2" fill="#ffdecc" stroke="#ea580c" stroke-width="2" />
    <rect x="640" y="250" width="24" height="90" rx="2" fill="#ff7a3d" stroke="#1b1c1a" stroke-width="2.5" />

    <!-- Help Request Section -->
    <rect x="440" y="390" width="270" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" />
    <text x="455" y="415" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" fill="#b45309">🔥 CHALLENGES &amp; HELPS</text>
    <text x="455" y="435" class="body-text" font-size="10.5" fill="#92400e">• Hiring: Searching for senior backend dev</text>
    <text x="455" y="450" class="body-text" font-size="10.5" fill="#92400e">• Intro: Need introductions to Seed VCs</text>
    <text x="455" y="475" font-family="monospace" font-size="9.5" font-weight="bold" fill="#b45309">ACTIONS IN CUE: 3 pending responses</text>
  </g>
</svg>