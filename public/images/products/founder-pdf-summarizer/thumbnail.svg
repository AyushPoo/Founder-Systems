<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
      .title-text { font-family: 'Outfit', sans-serif; font-weight: 900; fill: #1b1c1a; }
      .body-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; fill: #4b5563; }
      .mono-text { font-family: monospace; font-size: 11px; fill: #0d9488; font-weight: bold; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#1b1c1a" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#glowGrad)" />

  <!-- Tech Grid Overlay -->
  <path d="M 0,100 H 800 M 0,200 H 800 M 0,300 H 800 M 0,400 H 800 M 0,500 H 800 M 100,0 V 600 M 200,0 V 600 M 300,0 V 600 M 400,0 V 600 M 500,0 V 600 M 600,0 V 600 M 700,0 V 600" stroke="#1b1c1a" stroke-opacity="0.04" stroke-width="1" />
  
  <!-- Outer Border -->
  <rect x="20" y="20" width="760" height="560" rx="24" fill="none" stroke="#1b1c1a" stroke-width="3" />

  <!-- Main Wrapper (Centered) -->
  <g filter="url(#shadow)" transform="translate(-175, 0)">
    <rect x="420" y="80" width="310" height="440" rx="16" fill="#ffffff" stroke="#1b1c1a" stroke-width="3" />
    
    <!-- Window Header -->
    <rect x="420" y="80" width="310" height="40" rx="16" fill="#fcfbf7" />
    <rect x="420" y="120" width="310" height="2" fill="#1b1c1a" />
    <circle cx="445" cy="100" r="5" fill="#0d9488" stroke="#1b1c1a" stroke-width="1.5" />
    <circle cx="460" cy="100" r="5" fill="#1b1c1a" />
    <circle cx="475" cy="100" r="5" fill="#1b1c1a" />
    <text x="575" y="105" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#1b1c1a">document_audit.pdf</text>

    <!-- Document File Visual Mockup -->
    <g transform="translate(450, 140)">
      <!-- Back Page -->
      <rect x="30" y="10" width="180" height="240" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2" />
      
      <!-- Front Document Page -->
      <rect x="10" y="30" width="180" height="240" rx="8" fill="#ffffff" stroke="#1b1c1a" stroke-width="2" filter="url(#shadow)" />
      
      <!-- Inside Text Lines -->
      <line x1="30" y1="60" x2="170" y2="60" stroke="#1b1c1a" stroke-width="4" stroke-linecap="round" />
      <line x1="30" y1="80" x2="140" y2="80" stroke="#1b1c1a" stroke-width="4" stroke-linecap="round" />
      
      <!-- Redacted/Highlighted term sheet lines -->
      <rect x="30" y="105" width="80" height="15" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" />
      <text x="35" y="116" font-family="monospace" font-size="9" font-weight="bold" fill="#0f766e">VALUATION</text>
      
      <line x1="120" y1="112" x2="170" y2="112" stroke="#1b1c1a" stroke-width="3" stroke-linecap="round" />
      
      <rect x="30" y="135" width="60" height="15" fill="#fef3c7" stroke="#d97706" stroke-width="1" />
      <text x="35" y="146" font-family="monospace" font-size="9" font-weight="bold" fill="#b45309">VESTING</text>
      
      <line x1="100" y1="142" x2="170" y2="142" stroke="#9ca3af" stroke-width="3" stroke-dasharray="2 2" />

      <!-- Extraction Line/Arrow pointing outwards -->
      <path d="M 120,200 L 230,200" stroke="#0d9488" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round" />
      <polygon points="230,195 240,200 230,205" fill="#0d9488" stroke="#1b1c1a" stroke-width="1.5" />
    </g>

    <!-- Glowing Extract Window (placed inside) -->
    <rect x="580" y="320" width="130" height="180" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="3" filter="url(#shadow)" />
    
    <!-- Extraction header -->
    <rect x="580" y="320" width="130" height="30" rx="12" fill="#0d9488" />
    <text x="645" y="339" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="10" fill="#ffffff">SUMMARY</text>
    
    <text x="595" y="375" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1b1c1a">1. Pre-Money: $4M</text>
    <text x="595" y="395" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1b1c1a">2. Vesting: 4 Yrs</text>
    <text x="595" y="415" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1b1c1a">3. Board Seats: 3</text>
    
    <!-- Checklist Check -->
    <circle cx="645" cy="460" r="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2" />
    <path d="M 641,460 L 644,463 L 650,457" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>