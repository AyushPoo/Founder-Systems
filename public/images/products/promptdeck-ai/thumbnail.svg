<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
      .title-text { font-family: 'Outfit', sans-serif; font-weight: 900; fill: #1b1c1a; }
      .body-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; fill: #4b5563; }
      .badge-text { font-family: 'Outfit', sans-serif; font-weight: 800; fill: #ffffff; letter-spacing: 2px; }
      .mono-text { font-family: monospace; font-size: 11px; fill: #db2777; font-weight: bold; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7" />
      <stop offset="100%" stop-color="#fdf2f8" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#db2777" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#1b1c1a" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#glowGrad)" />

  <!-- Tech Grid Overlay -->
  <path d="M 0,100 H 800 M 0,200 H 800 M 0,300 H 800 M 0,400 H 800 M 0,500 H 800 M 100,0 V 600 M 200,0 V 600 M 300,0 V 600 M 400,0 V 600 M 500,0 V 600 M 600,0 V 600 M 700,0 V 600" stroke="#1b1c1a" stroke-opacity="0.04" stroke-width="1" />
  
  <!-- Outer Border -->
  <rect x="20" y="20" width="760" height="560" rx="24" fill="none" stroke="#1b1c1a" stroke-width="3" />

  <!-- Spec / Decision Tree Mockup -->
  <!-- Main Wrapper -->
  <g filter="url(#shadow)" transform="translate(-175, 0)">
    <rect x="420" y="80" width="310" height="440" rx="16" fill="#ffffff" stroke="#1b1c1a" stroke-width="3" />
    
    <!-- Window Header -->
    <rect x="420" y="80" width="310" height="40" rx="16" fill="#fcfbf7" />
    <rect x="420" y="120" width="310" height="2" fill="#1b1c1a" />
    <circle cx="445" cy="100" r="5" fill="#db2777" stroke="#1b1c1a" stroke-width="1.5" />
    <circle cx="460" cy="100" r="5" fill="#1b1c1a" />
    <circle cx="475" cy="100" r="5" fill="#1b1c1a" />
    <text x="575" y="105" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#1b1c1a">pitch_deck.pdf</text>

    <!-- Slides compiling visual Mockup -->
    <!-- Left side message bubble -->
    <rect x="435" y="135" width="190" height="52" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="1.5" />
    <text x="445" y="152" font-family="monospace" font-size="8.5" fill="#db2777">SYSTEM // PROMPT INPUT</text>
    <text x="445" y="170" class="body-text" font-weight="bold" font-size="10" fill="#1b1c1a">"Add a slide for our CAC stats..."</text>

    <!-- Arrow down linking to compilation -->
    <path d="M 530,195 L 530,225" stroke="#db2777" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2" />

    <!-- Slide 1 (Behind) -->
    <rect x="460" y="270" width="220" height="135" rx="8" fill="#fcfcfc" stroke="#d1d5db" stroke-width="1.5" />
    
    <!-- Slide 2 (Front - Active) -->
    <g transform="translate(480, 290)" filter="url(#shadow)">
      <rect width="220" height="135" rx="8" fill="#ffffff" stroke="#1b1c1a" stroke-width="2" />
      
      <!-- Slide title -->
      <text x="15" y="25" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" fill="#1b1c1a">Traction &amp; CAC Payback</text>
      <line x1="15" y1="35" x2="205" y2="35" stroke="#db2777" stroke-width="2" />

      <!-- Slide content graphic -->
      <!-- Mini columns representing CAC stats -->
      <rect x="25" y="60" width="18" height="45" rx="2" fill="#fce7f3" stroke="#db2777" stroke-width="1" />
      <rect x="55" y="70" width="18" height="35" rx="2" fill="#fce7f3" stroke="#db2777" stroke-width="1" />
      <rect x="85" y="80" width="18" height="25" rx="2" fill="#db2777" />
      
      <text x="115" y="75" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" fill="#10b981">4.2 Mo.</text>
      <text x="115" y="90" class="body-text" font-size="8" fill="#6b7280">Average CAC Payback</text>
      
      <!-- Slide page tag -->
      <text x="205" y="125" text-anchor="end" font-family="monospace" font-size="8" fill="#9ca3af">Slide 04/12</text>
    </g>

    <!-- PDF Export button mockup -->
    <rect x="440" y="450" width="270" height="42" rx="21" fill="#db2777" />
    <text x="575" y="475" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="13" fill="#ffffff">EXPORT PRESENTATION (PDF) 📥</text>
  </g>
</svg>