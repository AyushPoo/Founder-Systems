<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn Candidate Screener</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="shell">
      <!-- Loading state -->
      <section id="loadingState" class="panel">
        <p class="status">Reading profile...</p>
      </section>

      <!-- Error state -->
      <section id="errorState" class="panel hidden">
        <p class="eyebrow">Could not read profile</p>
        <p id="errorMessage" class="status error"></p>
        <p class="hint">Make sure you're on a LinkedIn profile page (linkedin.com/in/...)</p>
      </section>

      <!-- Profile summary (shown immediately) -->
      <section id="profileState" class="hidden">
        <div class="hero">
          <p class="eyebrow">Founder Systems</p>
          <h1 id="profileName">Candidate</h1>
          <p id="profileHeadline" class="subcopy"></p>
          <p id="profileLocation" class="meta"></p>
        </div>

        <div class="panel">
          <div id="profileExperience" class="profile-section hidden">
            <p class="section-label">Experience</p>
            <ul id="experienceList"></ul>
          </div>
          <div id="profileSkills" class="profile-section hidden">
            <p class="section-label">Skills</p>
            <p id="skillsText" class="skills-text"></p>
          </div>
          <div id="profileAbout" class="profile-section hidden">
            <p class="section-label">About</p>
            <p id="aboutText" class="about-text"></p>
          </div>
        </div>

        <!-- Screen against a role -->
        <div class="panel">
          <p class="section-label">Screen against a role</p>
          <label class="field">
            <textarea name="jobDescription" rows="4" placeholder="Paste the JD or role requirements to get a fit verdict."></textarea>
          </label>

          <label class="field">
            <textarea name="resumeText" rows="3" placeholder="Optional: paste resume for higher confidence."></textarea>
          </label>

          <div class="toggles">
            <label><input type="checkbox" name="includeActivity" checked /> Use recent activity</label>
          </div>

          <div class="actions">
            <button id="runScreen" type="button">Screen candidate</button>
          </div>

          <p id="status" class="status"></p>
        </div>
      </section>

      <!-- Screen result -->
      <section id="result" class="result hidden">
        <div class="result-head">
          <span id="verdict" class="verdict"></span>
          <span id="confidence" class="confidence"></span>
        </div>
        <p id="candidateSummary" class="summary"></p>
        <div class="result-block">
          <h2>Fit signals</h2>
          <ul id="fitSignals"></ul>
        </div>
        <div class="result-block">
          <h2>Gaps or risks</h2>
          <ul id="gapsOrRisks"></ul>
        </div>
        <div class="result-block">
          <h2>Interview checks</h2>
          <ul id="interviewChecks"></ul>
        </div>
        <div class="result-block">
          <h2>Recruiter notes</h2>
          <ul id="recruiterNotes"></ul>
        </div>
      </section>
    </main>

    <script src="./popup.js"></script>
  </body>
</html>
